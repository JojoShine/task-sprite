name: Release candidates
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish all three verified packages and online updates to OSS
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: task-sprite-release
  cancel-in-progress: false
jobs:
  candidates:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
          - os: macos-26
            platform: macos-aarch64
          - os: macos-15-intel
            platform: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - name: Verify release version
        shell: bash
        run: |
          node -e 'const fs=require("fs");const v=require("./package.json").version;const tag=process.env.GITHUB_REF_NAME;if(process.env.GITHUB_REF_TYPE==="tag"&&tag!=="v"+v)throw Error("tag/version mismatch");if(JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json")).version!==v)throw Error("native version mismatch")'
      - run: npm ci
      - name: Prepare original macOS credential agent
        if: runner.os == 'macOS'
        run: node scripts/prepare-ci-macos.mjs
      - name: Frontend and native verification
        shell: bash
        run: |
          mkdir -p ci-logs
          set -o pipefail
          npm test 2>&1 | tee ci-logs/frontend-tests.log
          npm run build 2>&1 | tee ci-logs/frontend-build.log
          cargo test --locked --manifest-path src-tauri/Cargo.toml -- --nocapture 2>&1 | tee ci-logs/native-tests.log
      - name: Build candidate
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" || -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]]; then
            echo 'Missing protected updater signing identity'; exit 1
          fi
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            npm run tauri -- build --bundles app 2>&1 | tee ci-logs/package.log
          else
            npm run tauri -- build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":true}}' 2>&1 | tee ci-logs/package.log
          fi
      - name: Sign and package macOS with original identity
        if: runner.os == 'macOS'
        env:
          MACOS_SIGNING_P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/finalize-ci-macos.mjs
      - name: Windows startup smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe)
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS package" }
          ./scripts/smoke-windows.ps1 -Installer $installers[0].FullName
      - name: macOS startup smoke
        if: runner.os == 'macOS'
        run: node scripts/smoke-macos.mjs
      - name: Collect verified platform packages
        run: node scripts/collect-ci-release.mjs
      - name: Verified packages
        uses: actions/upload-artifact@v4
        with:
          name: release-packages-${{ matrix.platform }}
          retention-days: 30
          if-no-files-found: error
          path: release-packages/
      - name: Candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ matrix.platform }}-${{ github.run_id }}
          retention-days: 30
          path: ci-logs/
  publish:
    needs: candidates
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reuse the website OSS publisher
        uses: actions/checkout@v4
        with:
          repository: JojoShine/task-sprite-site
          ref: 4f13aa764277aae3918da66ec43676852029892d
          path: release-site
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: release-site/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          pattern: release-packages-*
          merge-multiple: true
          path: release-packages
      - run: npm ci --prefix release-site
      - name: Publish verified packages to OSS; latest last
        env:
          OSS_REGION: ${{ secrets.OSS_REGION }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_PUBLIC_READ: 'true'
          DOWNLOAD_ORIGIN: ${{ secrets.OSS_ENDPOINT }}
        run: node release-site/scripts/publish-ci-release.mjs release-packages src-tauri/tauri.conf.json
