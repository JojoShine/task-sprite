name: Release candidates
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidates:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
          - os: macos-15
            platform: macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify release version
        shell: bash
        run: |
          node -e 'const fs=require("fs");const v=require("./package.json").version;const tag=process.env.GITHUB_REF_NAME;if(process.env.GITHUB_REF_TYPE==="tag"&&tag!=="v"+v)throw Error("tag/version mismatch");if(JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json")).version!==v)throw Error("native version mismatch")'
      - run: npm ci
      - name: Prepare original macOS credential agent
        if: runner.os == 'macOS'
        run: node scripts/prepare-ci-macos.mjs
      - name: Frontend and native verification
        shell: bash
        run: |
          mkdir -p ci-logs
          set -o pipefail
          npm test 2>&1 | tee ci-logs/frontend-tests.log
          npm run build 2>&1 | tee ci-logs/frontend-build.log
          cargo test --locked --manifest-path src-tauri/Cargo.toml -- --nocapture 2>&1 | tee ci-logs/native-tests.log
      - name: Build candidate (no private signing material)
        shell: bash
        run: |
          set -o pipefail
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            npm run tauri -- build --bundles app 2>&1 | tee ci-logs/package.log
          else
            npm run tauri -- build --bundles nsis 2>&1 | tee ci-logs/package.log
          fi
      - name: Windows startup smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe)
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS package" }
          ./scripts/smoke-windows.ps1 -Installer $installers[0].FullName
      - name: macOS startup smoke
        if: runner.os == 'macOS'
        run: node scripts/smoke-macos.mjs
      - name: Archive macOS app candidate
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent 'src-tauri/target/release/bundle/macos/Task Sprite.app' ci-logs/task-sprite-macos-aarch64-candidate.zip
      - name: Candidate package and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ matrix.platform }}-${{ github.ref_name }}
          retention-days: 30
          path: |
            ci-logs/
            src-tauri/target/release/bundle/nsis/*.exe
# Final macOS signing, package validation and OSS latest publication remain local.
# A failed platform never updates public downloads or a latest manifest.
